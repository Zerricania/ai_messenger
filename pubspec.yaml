name: ai_messenger
description: "AI Messenger — chat with AI characters"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Navigation & State
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2
  google_sign_in: ^6.2.2

  # Network (AI API)
  dio: ^5.9.0

  # Local storage
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Utils
  flutter_dotenv: ^6.0.0
  uuid: ^4.5.2
  intl: ^0.20.2
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/characters/
    - assets/images/
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
